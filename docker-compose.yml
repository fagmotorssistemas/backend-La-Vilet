# Compose file format 3.8 — compatible con docker-compose 1.29.2
# Desarrollo / Droplet local. En App Platform usar Dockerfile + volumen /data.
version: "3.8"

services:
  lavilet-meta-capi:
    build: .
    image: lavilet-meta-capi:local
    ports:
      # Solo loopback en el host (no exponer 0.0.0.0). App Platform usa el Dockerfile.
      - "127.0.0.1:${PORT:-3010}:3010"
    environment:
      PORT: 3010
      META_MODE: ${META_MODE:-disabled}
      META_DATASET_ID: ${META_DATASET_ID:-923439043758658}
      META_PIXEL_ID: ${META_PIXEL_ID:-923439043758658}
      META_API_VERSION: ${META_API_VERSION:-v21.0}
      META_WA_API_VERSION: ${META_WA_API_VERSION:-v26.0}
      META_CAPI_ACCESS_TOKEN: ${META_CAPI_ACCESS_TOKEN:-}
      # Token WA BM (LeadSubmitted). Distinto del token web; no reutilizar META_CAPI_ACCESS_TOKEN.
      META_WA_CAPI_ACCESS_TOKEN: ${META_WA_CAPI_ACCESS_TOKEN:-}
      META_WA_LEAD_SUBMITTED_DELIVERY_ENABLED: ${META_WA_LEAD_SUBMITTED_DELIVERY_ENABLED:-false}
      META_WA_CLOUD_WEBHOOK_CHALLENGE_ENABLED: ${META_WA_CLOUD_WEBHOOK_CHALLENGE_ENABLED:-false}
      META_WA_CLOUD_WEBHOOK_RECEIVE_ENABLED: ${META_WA_CLOUD_WEBHOOK_RECEIVE_ENABLED:-false}
      META_WA_VERIFY_TOKEN: ${META_WA_VERIFY_TOKEN:-}
      META_WA_APP_SECRET: ${META_WA_APP_SECRET:-}
      META_WABA_ID: ${META_WABA_ID:-}
      META_WA_PHONE_NUMBER_ID: ${META_WA_PHONE_NUMBER_ID:-}
      META_WA_CTWA_RECONCILE_ENABLED: ${META_WA_CTWA_RECONCILE_ENABLED:-true}
      META_WA_CTWA_RECONCILE_POLL_MS: ${META_WA_CTWA_RECONCILE_POLL_MS:-30000}
      META_TEST_EVENT_CODE: ${META_TEST_EVENT_CODE:-}
      META_CAPI_INTERNAL_SECRET: ${META_CAPI_INTERNAL_SECRET:?set META_CAPI_INTERNAL_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://www.lavilett.com,https://lavilett.com}
      DATABASE_PATH: /data/lavilet-meta-capi.db
      OUTBOX_ENABLED: ${OUTBOX_ENABLED:-true}
      OUTBOX_POLL_MS: ${OUTBOX_POLL_MS:-5000}
      OUTBOX_BATCH_SIZE: ${OUTBOX_BATCH_SIZE:-20}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-8}
      OUTBOX_RETENTION_DAYS: ${OUTBOX_RETENTION_DAYS:-90}
      META_HTTP_TIMEOUT_MS: ${META_HTTP_TIMEOUT_MS:-10000}
      META_PURCHASE_DELIVERY_ENABLED: ${META_PURCHASE_DELIVERY_ENABLED:-false}
      META_PURCHASE_ACTIVATED_AT: ${META_PURCHASE_ACTIVATED_AT:-}
      # Drain off por defecto: arranca sin Supabase. Si true, exige URL + service role.
      SUPABASE_DRAIN_ENABLED: ${SUPABASE_DRAIN_ENABLED:-false}
      SUPABASE_DRAIN_POLL_MS: ${SUPABASE_DRAIN_POLL_MS:-15000}
      SUPABASE_DRAIN_BATCH_SIZE: ${SUPABASE_DRAIN_BATCH_SIZE:-20}
      SUPABASE_DRAIN_LOCK_TTL_MS: ${SUPABASE_DRAIN_LOCK_TTL_MS:-60000}
      SUPABASE_URL: ${SUPABASE_URL:-}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
    volumes:
      # Persistencia de la cola outbox (sobrevive reinicios)
      - lavilet_capi_data:/data
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3010/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s

volumes:
  lavilet_capi_data:
